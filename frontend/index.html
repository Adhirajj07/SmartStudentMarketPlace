<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Student Marketplace</title>
    <link rel="stylesheet" href="css/styles.css" />
    <script>
      (function() {
        const t = localStorage.getItem("ssm_theme") || "dark";
        document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
      .google-btn-wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.8rem;
        margin-bottom: 0.5rem;
      }
      .google-hint {
        font-size: 0.8rem;
        color: #6b7280;
        text-align: center;
        margin-top: 0.2rem;
      }
      [data-theme="light"] .google-hint {
        color: #9ca3af;
      }
    </style>
  </head>
  <body>
    <div id="auth-container">
      <div class="auth-card">
        <div class="brand">
          <div class="brand-logo">SSM</div>
          <div>
            <h1>Smart Student Marketplace</h1>
            <p class="muted">Campus-only marketplace for safe, verified student-to-student deals.</p>
          </div>
        </div>

        <!-- GOOGLE SIGN IN -->
        <div class="google-btn-wrapper" id="google-section">
          <div id="g_id_onload"
            data-client_id="224675395582-o7l2qb4bl9c3hr8cjtondr8t010gqro7.apps.googleusercontent.com"
            data-callback="handleGoogleResponse"
            data-auto_prompt="false">
          </div>
          <div class="g_id_signin"
            data-type="standard"
            data-size="large"
            data-theme="outline"
            data-text="sign_in_with"
            data-shape="pill"
            data-logo_alignment="left"
            data-width="340">
          </div>
          <p class="google-hint">Use your <strong>@amjaincollege.edu.in</strong> Google account</p>
          <p id="google-error" class="error-text" style="text-align:center;"></p>
        </div>

        <!-- COMPLETE PROFILE FORM (shown after Google sign-in for new users only) -->
        <form id="complete-profile-form" class="auth-form hidden">
          <h2>Complete your profile</h2>
          <p class="muted">A few more details to verify your student identity.</p>
          <label>
            College Roll Number
            <input type="text" id="cp-roll" placeholder="e.g. 22CSE123" required />
          </label>
          <label>
            University Register Number
            <input type="text" id="cp-university-reg" placeholder="e.g. URN123456" required />
          </label>
          <label>
            Date of Birth
            <input type="date" id="cp-dob" required />
          </label>
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:0.8rem;">
            <label>
              Department
              <select id="cp-department" required>
                <option value="">Select dept</option>
                <option value="BCA">BCA</option>
                <option value="BSc CS">BSc CS</option>
                <option value="BSc IT">BSc IT</option>
                <option value="BE CSE">BE CSE</option>
                <option value="BE ECE">BE ECE</option>
                <option value="BE EEE">BE EEE</option>
                <option value="BE Mech">BE Mech</option>
                <option value="BE Civil">BE Civil</option>
                <option value="MBA">MBA</option>
                <option value="MCA">MCA</option>
                <option value="MSc">MSc</option>
              </select>
            </label>
            <label>
              Year
              <select id="cp-year" required>
                <option value="">Select year</option>
                <option value="1st Year">1st Year</option>
                <option value="2nd Year">2nd Year</option>
                <option value="3rd Year">3rd Year</option>
                <option value="4th Year">4th Year</option>
              </select>
            </label>
          </div>
          <p id="complete-profile-error" class="error-text" aria-live="polite"></p>
          <button type="submit" class="primary-btn full-width">Save &amp; Continue</button>
        </form>

      </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>
