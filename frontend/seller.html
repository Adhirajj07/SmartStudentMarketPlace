<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seller Profile — Smart Student Marketplace</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      .seller-page { max-width: 800px; margin: 2rem auto; padding: 0 1.5rem; }

      /* Seller profile card */
      .seller-profile-card {
        background: rgba(2,6,23,0.8);
        border: 1px solid rgba(148,163,184,0.3);
        border-radius: 1.4rem;
        padding: 1.8rem 2rem;
        display: flex;
        align-items: center;
        gap: 1.5rem;
        margin-bottom: 1.5rem;
      }
      .seller-avatar {
        width: 72px;
        height: 72px;
        border-radius: 50%;
        background: linear-gradient(135deg, #4f46e5, #818cf8);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.8rem;
        font-weight: 700;
        color: #fff;
        flex-shrink: 0;
        box-shadow: 0 8px 24px rgba(79,70,229,0.4);
      }
      .seller-info-block { flex: 1; }
      .seller-info-block h2 { font-size: 1.2rem; font-weight: 700; margin-bottom: 0.2rem; }
      .seller-dept { font-size: 0.82rem; color: #a5b4fc; margin-bottom: 0.4rem; }
      .seller-avg-rating { display: flex; align-items: center; gap: 0.5rem; }
      .stars-display { color: #fde68a; font-size: 1.1rem; letter-spacing: 0.05em; }
      .avg-number { font-size: 1.1rem; font-weight: 700; color: #fde68a; }
      .total-reviews { font-size: 0.8rem; color: #9ca3af; }
      .verified-badge {
        display: inline-flex;
        align-items: center;
        gap: 0.3rem;
        background: rgba(16,185,129,0.12);
        border: 1px solid rgba(16,185,129,0.4);
        color: #6ee7b7;
        font-size: 0.75rem;
        padding: 0.25rem 0.7rem;
        border-radius: 999px;
        margin-top: 0.5rem;
      }

      /* Review form */
      .review-form-card {
        background: rgba(2,6,23,0.7);
        border: 1px solid rgba(148,163,184,0.25);
        border-radius: 1.2rem;
        padding: 1.4rem 1.6rem;
        margin-bottom: 1.5rem;
      }
      .review-form-card h3 { font-size: 0.95rem; font-weight: 600; margin-bottom: 1rem; }
      .star-picker { display: flex; gap: 0.4rem; margin-bottom: 0.9rem; }
      .star-btn {
        background: none;
        border: none;
        font-size: 1.8rem;
        cursor: pointer;
        color: #374151;
        transition: color 0.1s, transform 0.1s;
        line-height: 1;
      }
      .star-btn:hover, .star-btn.active { color: #fde68a; transform: scale(1.15); }
      .review-textarea {
        width: 100%;
        background: rgba(15,23,42,0.9);
        border: 1px solid rgba(148,163,184,0.5);
        border-radius: 0.75rem;
        padding: 0.7rem 0.9rem;
        color: #e5e7eb;
        font-family: inherit;
        font-size: 0.88rem;
        resize: vertical;
        min-height: 80px;
        outline: none;
        transition: border-color 0.12s;
        margin-bottom: 0.4rem;
      }
      .review-textarea:focus { border-color: #6366f1; }
      .review-textarea::placeholder { color: #6b7280; }
      .word-count { font-size: 0.75rem; color: #9ca3af; margin-bottom: 0.7rem; }
      .word-count.over { color: #fca5a5; }
      .review-submit-row { display: flex; align-items: center; gap: 0.8rem; }
      .cant-review-msg {
        background: rgba(251,191,36,0.07);
        border: 1px solid rgba(251,191,36,0.3);
        border-radius: 0.8rem;
        padding: 0.7rem 1rem;
        font-size: 0.83rem;
        color: #fef3c7;
        margin-bottom: 1.5rem;
      }

      /* Reviews list */
      .reviews-section h3 { font-size: 0.95rem; font-weight: 600; margin-bottom: 1rem; }
      .review-card {
        background: rgba(2,6,23,0.6);
        border: 1px solid rgba(148,163,184,0.2);
        border-radius: 1rem;
        padding: 1rem 1.1rem;
        margin-bottom: 0.75rem;
        transition: border-color 0.12s;
      }
      .review-card:hover { border-color: rgba(129,140,248,0.4); }
      .review-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.4rem; }
      .review-buyer { font-size: 0.85rem; font-weight: 600; color: #e5e7eb; }
      .review-stars { color: #fde68a; font-size: 0.9rem; letter-spacing: 0.05em; }
      .review-comment { font-size: 0.83rem; color: #d1d5db; line-height: 1.5; margin-bottom: 0.3rem; }
      .review-date { font-size: 0.72rem; color: #6b7280; }
      .no-reviews { text-align: center; padding: 2rem; color: #6b7280; font-size: 0.88rem; }

      /* Seller's products */
      .seller-products-section { margin-top: 2rem; }
      .seller-products-section h3 { font-size: 0.95rem; font-weight: 600; margin-bottom: 1rem; }

      .seller-link {
        color: inherit;
        text-decoration: none;
        cursor: pointer;
      }
      .seller-link:hover { text-decoration: underline; color: #a5b4fc; }
    </style>
  </head>
  <body>
    <header class="top-nav">
      <div class="nav-left">
        <div class="brand-logo small">SSM</div>
        <div class="nav-title-group">
          <span class="nav-title">Smart Student Marketplace</span>
          <span class="nav-subtitle">For your campus community</span>
        </div>
      </div>
      <nav class="nav-center">
        <button class="nav-link" onclick="location.href='buy.html'">Buy</button>
        <button class="nav-link" onclick="location.href='sell.html'">Sell</button>
        <button class="nav-link" onclick="location.href='chat.html'">💬 Chats</button>
        <button class="nav-link" onclick="location.href='profile.html'">Profile</button>
      </nav>
      <div class="nav-right">
        <span id="current-user-email" class="nav-user"></span>
        <button id="logout-btn" class="ghost-btn">Logout</button>
      </div>
    </header>

    <div class="seller-page">

      <!-- Back button -->
      <button class="ghost-btn" style="margin-bottom:1rem;" onclick="history.back()">← Back</button>

      <!-- Seller profile card -->
      <div class="seller-profile-card" id="seller-profile-card">
        <div class="seller-avatar" id="seller-avatar">?</div>
        <div class="seller-info-block">
          <h2 id="seller-display-name">Loading…</h2>
          <div class="seller-dept" id="seller-dept"></div>
          <div class="seller-avg-rating">
            <span class="stars-display" id="seller-stars"></span>
            <span class="avg-number" id="seller-avg-num"></span>
            <span class="total-reviews" id="seller-total-reviews"></span>
          </div>
          <div class="verified-badge">✅ Verified Student</div>
        </div>
      </div>

      <!-- Review form (shown if buyer can review) -->
      <div id="review-form-wrapper"></div>

      <!-- All reviews -->
      <div class="reviews-section">
        <h3 id="reviews-heading">Reviews</h3>
        <div id="reviews-list">
          <p class="muted small">Loading reviews…</p>
        </div>
      </div>

      <!-- Seller's product listings -->
      <div class="seller-products-section">
        <h3>Products by this seller</h3>
        <div id="seller-products" class="products-grid">
          <p class="muted small">Loading products…</p>
        </div>
      </div>

    </div>

    <script src="js/api.js"></script>
    <script src="js/common.js"></script>
    <script src="js/seller.js"></script>
  </body>
</html>
