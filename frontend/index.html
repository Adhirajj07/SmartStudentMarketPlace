<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Student Marketplace</title>
    <link rel="stylesheet" href="css/styles.css" />
    <script>
      (function() {
        const t = localStorage.getItem("ssm_theme") || "dark";
        document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
      .google-btn-wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.8rem;
        margin-bottom: 0.5rem;
      }
      .google-signin-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.65rem;
        width: 100%;
        padding: 0.65rem 1rem;
        border-radius: 999px;
        border: 1px solid rgba(148,163,184,0.4);
        background: rgba(15,23,42,0.7);
        color: #e5e7eb;
        font-size: 0.9rem;
        font-weight: 500;
        cursor: pointer;
        transition: background 0.12s, border-color 0.12s;
        font-family: inherit;
      }
      .google-signin-btn:hover {
        background: rgba(255,255,255,0.06);
        border-color: rgba(148,163,184,0.7);
      }
      .google-signin-btn img {
        width: 20px; height: 20px;
      }
      .or-divider {
        display: flex;
        align-items: center;
        gap: 0.7rem;
        width: 100%;
        color: #6b7280;
        font-size: 0.8rem;
      }
      .or-divider::before, .or-divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: rgba(148,163,184,0.2);
      }
      [data-theme="light"] .google-signin-btn {
        background: #ffffff !important;
        border-color: #d1d5db !important;
        color: #374151 !important;
        box-shadow: 0 1px 4px rgba(0,0,0,0.1) !important;
      }
      [data-theme="light"] .google-signin-btn:hover {
        background: #f9fafb !important;
        border-color: #9ca3af !important;
      }
      [data-theme="light"] .or-divider {
        color: #9ca3af !important;
      }
    </style>
  </head>
  <body>
    <div id="auth-container">
      <div class="auth-card">
        <div class="brand">
          <div class="brand-logo">SSM</div>
          <div>
            <h1>Smart Student Marketplace</h1>
            <p class="muted">Campus-only marketplace for safe, verified student-to-student deals.</p>
          </div>
        </div>

        <div class="auth-toggle">
          <button id="show-login" class="active">Login</button>
          <button id="show-register">Register</button>
        </div>

        <!-- GOOGLE SIGN IN -->
        <div class="google-btn-wrapper">
          <div id="g_id_onload"
            data-client_id="224675395582-o7l2qb4bl9c3hr8cjtondr8t010gqro7.apps.googleusercontent.com"
            data-callback="handleGoogleResponse"
            data-auto_prompt="false">
          </div>
          <div class="g_id_signin"
            data-type="standard"
            data-size="large"
            data-theme="outline"
            data-text="sign_in_with"
            data-shape="pill"
            data-logo_alignment="left"
            data-width="340">
          </div>
          <p id="google-error" class="error-text" style="text-align:center;"></p>
        </div>

        <div class="or-divider">or</div>

        <!-- LOGIN FORM -->
        <form id="login-form" class="auth-form">
          <h2>Welcome back</h2>
          <label>
            College email
            <input type="email" id="login-email" placeholder="you@amjaincollege.edu.in" required />
          </label>
          <label>
            Password
            <input type="password" id="login-password" placeholder="••••••••" required />
          </label>
          <p id="login-error" class="error-text" aria-live="polite"></p>
          <button type="submit" class="primary-btn full-width">Login</button>
        </form>

        <!-- REGISTER FORM -->
        <form id="register-form" class="auth-form hidden">
          <h2>Create your campus account</h2>
          <label>
            Full Name
            <input type="text" id="register-name" placeholder="Your full name" required />
          </label>
          <label>
            College email
            <input type="email" id="register-email" placeholder="you@amjaincollege.edu.in" required />
          </label>
          <label>
            Password
            <input type="password" id="register-password" placeholder="Create a strong password" minlength="6" required />
          </label>
          <label>
            College Roll Number
            <input type="text" id="register-roll" placeholder="e.g. 22CSE123" required />
          </label>
          <label>
            University Register Number
            <input type="text" id="register-university-reg" placeholder="e.g. URN123456" required />
          </label>
          <label>
            Date of Birth
            <input type="date" id="register-dob" required />
          </label>

          <div style="display:grid; grid-template-columns:1fr 1fr; gap:0.8rem;">
            <label>
              Department
              <select id="register-department" required>
                <option value="">Select dept</option>
                <option value="BCA">BCA</option>
                <option value="BSc CS">BSc CS</option>
                <option value="BSc IT">BSc IT</option>
                <option value="BE CSE">BE CSE</option>
                <option value="BE ECE">BE ECE</option>
                <option value="BE EEE">BE EEE</option>
                <option value="BE Mech">BE Mech</option>
                <option value="BE Civil">BE Civil</option>
                <option value="MBA">MBA</option>
                <option value="MCA">MCA</option>
                <option value="MSc">MSc</option>
              </select>
            </label>
            <label>
              Year
              <select id="register-year" required>
                <option value="">Select year</option>
                <option value="1st Year">1st Year</option>
                <option value="2nd Year">2nd Year</option>
                <option value="3rd Year">3rd Year</option>
                <option value="4th Year">4th Year</option>
              </select>
            </label>
          </div>

          <p class="muted small">
            Only official college email IDs are allowed (e.g. <code>@amjaincollege.edu.in</code>).
          </p>
          <p id="register-error" class="error-text" aria-live="polite"></p>
          <button type="submit" class="primary-btn full-width">Register</button>
        </form>
      </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>
